name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: remate
          POSTGRES_PASSWORD: remate-ci
          POSTGRES_DB: remate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Only for this throwaway CI database. The tests never call the real AI or mail server.
      APP_ENV: development
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: remate
      DB_USER: remate
      DB_PASSWORD: remate-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest --cov

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:cobertura
      - run: npm run build
